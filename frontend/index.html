<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Movie Mind — Movie Recommender</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #0B0E14;
            --surface: #151A24;
            --surface-raised: #1D2430;
            --gold: #E8B84B;
            --rust: #C1443A;
            --text: #F2F0EA;
            --text-muted: #8890A0;
            --border: #2A3140;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }

        .sprocket {
            height: 14px;
            background-color: var(--gold);
            background-image: radial-gradient(circle at center, var(--bg) 3px, transparent 3.5px);
            background-size: 18px 14px;
            background-repeat: repeat-x;
            background-position: 9px center;
        }

        header {
            background: linear-gradient(180deg, #171C27 0%, var(--bg) 100%);
            text-align: center;
            padding: 48px 24px 40px;
        }

        header h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(3rem, 8vw, 5.5rem);
            letter-spacing: 0.08em;
            margin: 0.2em 0 0.1em;
            color: var(--gold);
            text-shadow: 0 0 24px rgba(232, 184, 75, 0.25);
        }

        header p {
            color: var(--text-muted);
            font-size: 1.05rem;
            margin: 0;
        }

        main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 24px 80px;
        }

        .search-wrap {
            position: relative;
            max-width: 560px;
            margin: 0 auto 8px;
        }

        #search-input {
            width: 100%;
            padding: 16px 20px;
            font-size: 1.05rem;
            font-family: 'Inter', sans-serif;
            color: var(--text);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            outline: none;
            transition: border-color 0.15s ease;
        }

        #search-input:focus {
            border-color: var(--gold);
        }

        #autocomplete-list {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            right: 0;
            background: var(--surface-raised);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            z-index: 10;
            display: none;
        }

        #autocomplete-list.visible {
            display: block;
        }

        .autocomplete-item {
            padding: 12px 20px;
            cursor: pointer;
            font-size: 0.95rem;
            border-bottom: 1px solid var(--border);
        }

        .autocomplete-item:last-child {
            border-bottom: none;
        }

        .autocomplete-item:hover,
        .autocomplete-item.active {
            background: rgba(232, 184, 75, 0.12);
            color: var(--gold);
        }

        .status-line {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            min-height: 1.4em;
            margin-top: 14px;
        }

        .status-line.error {
            color: var(--rust);
        }

        .results-header {
            margin: 56px 0 20px;
            text-align: center;
        }

        .results-header .eyebrow {
            font-family: 'Bebas Neue', sans-serif;
            letter-spacing: 0.15em;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .results-header h2 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2.2rem;
            letter-spacing: 0.03em;
            color: var(--text);
            margin: 0.2em 0 0;
        }

        #results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 24px;
            animation: fade-up 0.35s ease both;
        }

        @keyframes fade-up {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .movie-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
        }

        .movie-card:hover {
            transform: translateY(-4px);
            border-color: rgba(232, 184, 75, 0.4);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35);
        }

        :focus-visible {
            outline: 2px solid var(--gold);
            outline-offset: 2px;
        }

        @media (prefers-reduced-motion: reduce) {

            .movie-card,
            #results-grid {
                transition: none;
                animation: none;
            }

            .movie-card:hover {
                transform: none;
            }
        }

        .movie-card .poster-frame {
            position: relative;
        }

        .movie-card .poster {
            width: 100%;
            aspect-ratio: 2 / 3;
            object-fit: cover;
            display: block;
            background: var(--surface-raised);
        }

        .movie-card .poster-fallback {
            width: 100%;
            aspect-ratio: 2 / 3;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--surface-raised);
            color: var(--border);
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1rem;
            letter-spacing: 0.05em;
            text-align: center;
            padding: 12px;
        }

        .movie-card .card-body {
            padding: 14px 16px 16px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .movie-card .title {
            font-weight: 600;
            font-size: 0.98rem;
            line-height: 1.3;
        }

        .movie-card .genres {
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        .sim-meter {
            margin-top: auto;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sim-meter .track {
            flex: 1;
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            overflow: hidden;
        }

        .sim-meter .fill {
            height: 100%;
            background: var(--gold);
        }

        .sim-meter .pct {
            font-size: 0.72rem;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
            min-width: 32px;
            text-align: right;
        }

        .empty-state,
        .initial-state {
            text-align: center;
            color: var(--text-muted);
            padding: 40px 20px;
            font-size: 0.95rem;
        }

        .initial-state {
            margin-top: 40px;
        }
    </style>
</head>

<body>

    <div class="sprocket"></div>
    <header>
        <p>content-based movie recommendations</p>
        <h1>REEL FINDER</h1>
        <p>Type a movie you love. Get ten more worth watching.</p>
    </header>
    <div class="sprocket"></div>

    <main>
        <div class="search-wrap">
            <input id="search-input" type="text" placeholder="Search for a movie…" autocomplete="off">
            <div id="autocomplete-list"></div>
        </div>
        <div id="status-line" class="status-line"></div>

        <div id="results-section"></div>
    </main>

    <script>
        const API_BASE_URL = "https://movie-recommender-wlcl.onrender.com";

        const searchInput = document.getElementById("search-input");
        const autocompleteList = document.getElementById("autocomplete-list");
        const statusLine = document.getElementById("status-line");
        const resultsSection = document.getElementById("results-section");

        let debounceTimer = null;
        let activeIndex = -1;
        let currentSuggestions = [];

        resultsSection.innerHTML = `
    <div class="initial-state">Cue up a title above to start the reel.</div>
  `;

        searchInput.addEventListener("input", () => {
            clearTimeout(debounceTimer);
            const query = searchInput.value.trim();
            if (!query) {
                hideAutocomplete();
                return;
            }
            debounceTimer = setTimeout(() => fetchSuggestions(query), 200);
        });

        searchInput.addEventListener("keydown", (e) => {
            if (!autocompleteList.classList.contains("visible")) return;

            if (e.key === "ArrowDown") {
                e.preventDefault();
                moveActive(1);
            } else if (e.key === "ArrowUp") {
                e.preventDefault();
                moveActive(-1);
            } else if (e.key === "Enter") {
                e.preventDefault();
                if (activeIndex >= 0 && currentSuggestions[activeIndex]) {
                    selectMovie(currentSuggestions[activeIndex]);
                } else if (currentSuggestions.length > 0) {
                    selectMovie(currentSuggestions[0]);
                } else {
                    selectMovie(searchInput.value.trim());
                }
            } else if (e.key === "Escape") {
                hideAutocomplete();
            }
        });

        document.addEventListener("click", (e) => {
            if (!e.target.closest(".search-wrap")) hideAutocomplete();
        });

        async function fetchSuggestions(query) {
            try {
                const res = await fetch(`${API_BASE_URL}/movies?q=${encodeURIComponent(query)}&limit=8`);
                if (!res.ok) throw new Error(`Server responded ${res.status}`);
                const titles = await res.json();
                currentSuggestions = titles;
                activeIndex = -1;
                renderAutocomplete(titles);
                setStatus("");
            } catch (err) {
                hideAutocomplete();
                setStatus("Couldn't reach the backend. Is it running at " + API_BASE_URL + "?", true);
            }
        }

        function renderAutocomplete(titles) {
            if (titles.length === 0) {
                hideAutocomplete();
                return;
            }
            autocompleteList.innerHTML = titles
                .map((t, i) => `<div class="autocomplete-item" data-index="${i}">${escapeHtml(t)}</div>`)
                .join("");
            autocompleteList.classList.add("visible");

            autocompleteList.querySelectorAll(".autocomplete-item").forEach((el) => {
                el.addEventListener("click", () => selectMovie(titles[parseInt(el.dataset.index)]));
            });
        }

        function moveActive(direction) {
            const items = autocompleteList.querySelectorAll(".autocomplete-item");
            if (items.length === 0) return;
            activeIndex = (activeIndex + direction + items.length) % items.length;
            items.forEach((el, i) => el.classList.toggle("active", i === activeIndex));
            searchInput.value = currentSuggestions[activeIndex];
        }

        function hideAutocomplete() {
            autocompleteList.classList.remove("visible");
            autocompleteList.innerHTML = "";
        }

        function selectMovie(title) {
            searchInput.value = title;
            hideAutocomplete();
            fetchRecommendations(title);
        }

        async function fetchRecommendations(title) {
            setStatus("Rolling the reel…");
            resultsSection.innerHTML = "";
            try {
                const res = await fetch(`${API_BASE_URL}/recommend?title=${encodeURIComponent(title)}&top_n=10`);
                if (res.status === 404) {
                    setStatus("");
                    resultsSection.innerHTML = `<div class="empty-state">That title didn't make the cut. Try another.</div>`;
                    return;
                }
                if (!res.ok) throw new Error(`Server responded ${res.status}`);
                const data = await res.json();
                setStatus("");
                renderResults(data);
            } catch (err) {
                setStatus("Couldn't reach the backend. Is it running at " + API_BASE_URL + "?", true);
            }
        }

        function renderResults(data) {
            const { query, results } = data;

            if (!results || results.length === 0) {
                resultsSection.innerHTML = `<div class="empty-state">No close matches found for "${escapeHtml(query)}".</div>`;
                return;
            }

            const cards = results.map(buildCard).join("");

            resultsSection.innerHTML = `
      <div class="results-header">
        <div class="eyebrow">BECAUSE YOU WATCHED</div>
        <h2>${escapeHtml(query)}</h2>
      </div>
      <div class="sprocket" style="margin-bottom:24px;"></div>
      <div id="results-grid">${cards}</div>
    `;
        }

        function buildCard(movie) {
            const pct = Math.round((movie.similarity || 0) * 100);
            const posterUrl = movie.poster_path
                ? (movie.poster_path.startsWith("http")
                    ? movie.poster_path
                    : `https://image.tmdb.org/t/p/w342${movie.poster_path}`)
                : null;

            const posterHtml = posterUrl
                ? `<img class="poster" src="${posterUrl}" alt="${escapeHtml(movie.title)} poster" loading="lazy"
           onerror="this.replaceWith(Object.assign(document.createElement('div'),
             {className:'poster-fallback', textContent:'${escapeHtml(movie.title)}'}))">`
                : `<div class="poster-fallback">${escapeHtml(movie.title)}</div>`;

            const genres = movie.genres ? `<div class="genres">${escapeHtml(String(movie.genres))}</div>` : "";

            return `
      <div class="movie-card">
        <div class="poster-frame">${posterHtml}</div>
        <div class="card-body">
          <div class="title">${escapeHtml(movie.title)}</div>
          ${genres}
          <div class="sim-meter">
            <div class="track"><div class="fill" style="width:${pct}%"></div></div>
            <div class="pct">${pct}%</div>
          </div>
        </div>
      </div>
    `;
        }

        function setStatus(message, isError = false) {
            statusLine.textContent = message;
            statusLine.classList.toggle("error", isError);
        }

        function escapeHtml(str) {
            const div = document.createElement("div");
            div.textContent = str;
            return div.innerHTML;
        }
    </script>

</body>

</html>
